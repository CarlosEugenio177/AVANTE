name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: avante_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Turborepo
      run: npm install -g turbo

    - name: Install Dependencies
      run: npm install

    - name: Generate Prisma Client
      run: npm run db:generate

    - name: Push Test Schema
      run: npx dotenv -e apps/api/.env.test -- prisma db push --schema=packages/shared/prisma/schema.prisma --accept-data-loss

    - name: Lint
      run: turbo run lint

    - name: Unit Tests (Shared, Web, API)
      run: turbo run test

    - name: API Integration Tests
      run: turbo run test:e2e
      env:
        DATABASE_URL: postgresql://root:password123@localhost:5433/avante_test?schema=public
        JWT_SECRET: test_secret_key_123

    - name: Install Playwright Browsers
      run: cd apps/e2e && npx playwright install --with-deps chromium

    - name: Build Web App
      run: turbo run build --filter=@avante/web

    - name: Playwright E2E Tests
      run: |
        # Start API
        cd apps/api && npm run start:dev &
        # Start Web Preview
        cd apps/web && npm run preview -- --port 5173 &
        # Wait for services
        sleep 10
        # Run Playwright
        cd apps/e2e && npm run test
      env:
        DATABASE_URL: postgresql://root:password123@localhost:5433/avante_test?schema=public
        JWT_SECRET: test_secret_key_123
        VITE_API_URL: http://localhost:3000

    - name: Upload Playwright Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: apps/e2e/playwright-report/
        retention-days: 10
