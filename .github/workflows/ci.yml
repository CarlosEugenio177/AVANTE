name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install Turborepo
      run: npm install -g turbo

    - name: Install Dependencies
      run: npm install

    - name: Generate Prisma Client
      run: npm run db:generate

    - name: Create Env Files
      run: |
        echo "DATABASE_URL=postgresql://root:password123@localhost:5433/avante_test?schema=public" > apps/api/.env.test
        echo "JWT_SECRET=test_secret_key_123" >> apps/api/.env.test
        echo "DATABASE_URL=postgresql://root:password123@localhost:5433/avante_test?schema=public" > apps/api/.env
        echo "JWT_SECRET=test_secret_key_123" >> apps/api/.env

    - name: Lint
      run: turbo run lint

    - name: Unit Tests (Shared, Web, API)
      run: turbo run test

    - name: API Integration Tests
      run: turbo run test:e2e

    - name: Install Playwright Browsers
      run: cd apps/e2e && npx playwright install --with-deps chromium

    - name: Build Web App
      run: turbo run build --filter=@avante/web

    - name: Playwright E2E Tests
      run: |
        # Ensure test database is running (it should be from test:e2e, but just in case)
        cd apps/api && docker-compose -f docker-compose.test.yml up -d
        
        # Start API
        cd apps/api && npm run start:dev &
        
        # Start Web Preview
        cd apps/web && npm run preview -- --port 5173 &
        
        # Wait for services
        sleep 15
        
        # Run Playwright E2E and Visual Tests
        cd apps/e2e && npm run test
      env:
        VITE_API_URL: http://localhost:3000

    - name: Run Lighthouse CI
      run: |
        npm install -g @lhci/cli
        lhci autorun
      env:
        LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

    - name: Upload Playwright Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: apps/e2e/playwright-report/
        retention-days: 10
